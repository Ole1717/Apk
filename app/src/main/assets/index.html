<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Instaweb</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#08090c;
    color:#f5f5f7;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    color:inherit;
    cursor:pointer;
}

#app{
    min-height:100vh;
}

/* ---------- HOME ---------- */

.page{
    min-height:100vh;
    padding:22px 20px 105px;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 5%,rgba(120,150,255,.16),transparent 30%),
        radial-gradient(circle at 90% 25%,rgba(190,110,255,.12),transparent 28%),
        linear-gradient(145deg,#08090c,#101116 55%,#090a0d);
}

.page:before{
    content:"";
    position:absolute;
    width:260px;
    height:260px;
    border-radius:50%;
    background:rgba(100,150,255,.08);
    filter:blur(70px);
    top:-90px;
    left:-80px;
    pointer-events:none;
}

.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
    z-index:2;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.logo{
    width:43px;
    height:43px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    font-weight:800;
    background:linear-gradient(145deg,#ffffff,#9ca3af);
    color:#101116;
    box-shadow:
        0 8px 25px rgba(0,0,0,.35),
        inset 0 1px 1px rgba(255,255,255,.8);
}

.name{
    font-size:22px;
    font-weight:750;
    letter-spacing:-.5px;
}

.gear{
    width:45px;
    height:45px;
    border-radius:16px;
    background:rgba(255,255,255,.09);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.10);
    font-size:21px;
}

/* ---------- HERO ---------- */

.hero{
    margin-top:58px;
    position:relative;
    z-index:1;
}

.hero h1{
    margin:0;
    font-size:38px;
    line-height:1.05;
    letter-spacing:-1.8px;
}

.hero h1 span{
    color:#858992;
}

.sub{
    margin-top:13px;
    color:#858992;
    font-size:15px;
    line-height:1.45;
}

/* ---------- SEARCH ---------- */

.searchWrap{
    margin-top:28px;
}

.search{
    height:64px;
    padding:6px;
    display:flex;
    align-items:center;
    gap:6px;
    border-radius:22px;

    background:rgba(255,255,255,.085);
    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);

    box-shadow:
        0 18px 50px rgba(0,0,0,.25),
        inset 0 1px 1px rgba(255,255,255,.08);
}

.searchIcon{
    width:46px;
    text-align:center;
    font-size:22px;
    color:#aeb2bb;
}

.search input{
    min-width:0;
    flex:1;
    height:52px;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    font-size:16px;
}

.search input::placeholder{
    color:#858992;
}

.search button{
    width:52px;
    height:52px;
    border-radius:17px;
    background:rgba(255,255,255,.13);
    font-size:24px;
    transition:.2s;
}

.search button:active{
    transform:scale(.92);
}

/* ---------- QUICK ACCESS ---------- */

.section{
    margin-top:34px;
}

.sectionTitle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.sectionTitle h2{
    margin:0;
    font-size:18px;
}

.sectionTitle span{
    color:#737780;
    font-size:13px;
}

.sites{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:11px;
}

.site{
    min-height:105px;
    padding:14px 8px;
    border-radius:22px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;

    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.09);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    transition:transform .18s,background .18s;
}

.site:active{
    transform:scale(.95);
    background:rgba(255,255,255,.13);
}

.icon{
    width:43px;
    height:43px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.11);
    font-size:20px;
    font-weight:700;
}

.site small{
    color:#c9cbd0;
    font-size:12px;
}

/* ---------- DISCOVER ---------- */

.discover{
    margin-top:28px;
    padding:23px;
    min-height:170px;
    border-radius:27px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.045)
        );

    border:1px solid rgba(255,255,255,.11);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.08),
        0 18px 45px rgba(0,0,0,.2);
}

.discover .label{
    color:#747982;
    font-size:11px;
    letter-spacing:2px;
    font-weight:700;
}

.discover h2{
    margin:12px 0 8px;
    font-size:27px;
    line-height:1.05;
    letter-spacing:-1px;
}

/* ---------- BOTTOM NAV ---------- */

.bottom{
    position:fixed;
    z-index:20;
    left:14px;
    right:14px;
    bottom:12px;
    height:70px;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    padding:6px;

    border-radius:25px;

    background:rgba(20,21,26,.78);
    border:1px solid rgba(255,255,255,.11);

    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);

    box-shadow:
        0 12px 40px rgba(0,0,0,.45),
        inset 0 1px 1px rgba(255,255,255,.08);
}

.nav{
    background:transparent;
    border-radius:19px;
    color:#777b84;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    font-size:21px;
}

.nav small{
    font-size:10px;
}

.nav.active{
    color:white;
    background:rgba(255,255,255,.09);
}

/* ---------- PANELS ---------- */

.panel{
    min-height:100vh;
    padding:24px 20px 100px;
    background:
        radial-gradient(circle at 80% 0%,rgba(130,150,255,.12),transparent 30%),
        #090a0e;
}

.panel h2{
    margin:35px 0 20px;
    font-size:30px;
}

.close{
    padding:12px 18px;
    border-radius:16px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.09);
}

.card{
    padding:17px;
    margin-bottom:11px;
    border-radius:20px;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.08);
}

.card b{
    display:block;
    margin-bottom:6px;
}

.card .muted{
    word-break:break-word;
}

.card button,
.row button{
    margin-top:12px;
    padding:10px 14px;
    border-radius:13px;
    background:rgba(255,255,255,.10);
}

.row{
    padding:18px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.muted{
    color:#858992;
}

/* ---------- SMALL DEVICES ---------- */

@media(max-width:370px){
    .hero h1{
        font-size:33px;
    }

    .page{
        padding-left:15px;
        padding-right:15px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const A = window.InstawebNative;

let screen = "home";
let privateMode = false;

let bookmarks = [];

try{
    bookmarks = JSON.parse(
        A.getBookmarks() || "[]"
    );
}catch(e){
    bookmarks = [];
}

let tabs = [
    {
        url:"https://duckduckgo.com",
        title:"DuckDuckGo"
    }
];

let active = 0;


/* ---------- URL ---------- */

function norm(v){

    v = String(v || "").trim();

    if(!v){
        return "https://duckduckgo.com";
    }

    if(
        /^https?:\/\//i.test(v)
    ){
        return v;
    }

    if(
        /^[\w.-]+\.[a-z]{2,}/i.test(v)
    ){
        return "https://" + v;
    }

    return "https://duckduckgo.com/?q=" +
        encodeURIComponent(v);
}


/* ---------- SEARCH ---------- */

function search(){

    const input =
        document.getElementById("q");

    if(!input){
        return;
    }

    const value =
        input.value.trim();

    if(!value){
        input.focus();
        return;
    }

    const url = norm(value);

    tabs[active].url = url;
    tabs[active].title = value;

    screen = "browser";

    A.navigate(url);
}


/* ---------- HOME ---------- */

function home(){

    screen = "home";

    render();
}


/* ---------- BROWSER ---------- */

function browser(){

    screen = "browser";

    render();
}


/* ---------- ESCAPE ---------- */

function esc(s){

    return String(s || "")
        .replace(
            /[&<>"]/g,
            c => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                "\"":"&quot;"
            }[c])
        );
}


/* ---------- NAVIGATION ---------- */

function nav(){

    return `
    <div class="bottom">

        <button
            class="nav active"
            onclick="home()"
        >
            ⌂
            <small>Главная</small>
        </button>

        <button
            class="nav"
            onclick="historyPanel()"
        >
            ◷
            <small>История</small>
        </button>

        <button
            class="nav"
            onclick="tabsPanel()"
        >
            ▢
            <small>Вкладки</small>
        </button>

        <button
            class="nav"
            onclick="menu()"
        >
            ☰
            <small>Меню</small>
        </button>

    </div>
    `;
}


/* ---------- HOME SCREEN ---------- */

function render(){

    const app =
        document.getElementById("app");

    if(screen === "tabs"){
        tabsPanel(true);
        return;
    }

    if(screen === "history"){
        historyPanel();
        return;
    }

    if(screen === "bookmarks"){
        bookmarkPanel();
        return;
    }

    if(screen === "settings"){
        settingsPanel();
        return;
    }

    app.innerHTML = `

    <div class="page">

        <div class="top">

            <div class="brand">

                <div class="logo">
                    I
                </div>

                <div class="name">
                    Instaweb
                </div>

            </div>

            <button
                class="gear"
                onclick="settingsPanel()"
            >
                ⚙
            </button>

        </div>


        <div class="hero">

            <h1>
                Что будем искать
                <span>сегодня?</span>
            </h1>

            <div class="sub">
                Быстро. Просто. Твоё пространство
                в интернете.
            </div>


            <div class="searchWrap">

                <div class="search">

                    <div class="searchIcon">
                        ⌕
                    </div>

                    <input
                        id="q"
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                        placeholder="Поиск или адрес сайта"
                        onkeydown="
                            if(event.key==='Enter'){
                                search();
                            }
                        "
                    >

                    <button
                        onclick="search()"
                    >
                        →
                    </button>

                </div>

            </div>

        </div>


        <div class="section">

            <div class="sectionTitle">

                <h2>
                    Быстрый доступ
                </h2>

                <span>
                    Твои сайты
                </span>

            </div>


            <div class="sites">

                <button
                    class="site"
                    onclick="
                        A.navigate('https://youtube.com')
                    "
                >
                    <span class="icon">
                        ▶
                    </span>

                    <small>
                        YouTube
                    </small>
                </button>


                <button
                    class="site"
                    onclick="
                        A.navigate('https://wikipedia.org')
                    "
                >
                    <span class="icon">
                        W
                    </span>

                    <small>
                        Wikipedia
                    </small>
                </button>


                <button
                    class="site"
                    onclick="
                        A.navigate('https://duckduckgo.com')
                    "
                >
                    <span class="icon">
                        D
                    </span>

                    <small>
                        Search
                    </small>
                </button>

            </div>

        </div>


        <div class="discover">

            <div class="label">
                INSTAWEB
            </div>

            <h2>
                Твой интернет.<br>
                Твой браузер.
            </h2>

            <div class="muted">
                Приватность, скорость и удобство
                в одном месте.
            </div>

        </div>

    </div>

    ${nav()}

    `;
}


/* ---------- PANEL ---------- */

function panel(title,body){

    document.getElementById("app").innerHTML = `

        <div class="panel">

            <button
                class="close"
                onclick="home()"
            >
                ← Назад
            </button>

            <h2>
                ${title}
            </h2>

            ${body}

        </div>
    `;
}


/* ---------- TABS ---------- */

function tabsPanel(){

    panel(
        "Вкладки",

        tabs.map(
            (t,i) => `

            <div class="card">

                <b>
                    ${esc(t.title)}
                </b>

                <div class="muted">
                    ${esc(t.url)}
                </div>

                <button
                    onclick="
                        active=${i};
                        A.navigate(tabs[active].url)
                    "
                >
                    Открыть
                </button>

                <button
                    onclick="
                        tabs.splice(${i},1);

                        if(!tabs.length){
                            tabs=[{
                                url:'https://duckduckgo.com',
                                title:'Search'
                            }];
                        }

                        active=Math.min(
                            active,
                            tabs.length-1
                        );

                        tabsPanel()
                    "
                >
                    Закрыть
                </button>

            </div>

            `
        ).join("") +

        `

        <div class="card">

            <button
                onclick="
                    tabs.push({
                        url:'https://duckduckgo.com',
                        title:'Search'
                    });

                    active=tabs.length-1;

                    A.navigate(
                        tabs[active].url
                    );
                "
            >
                + Новая вкладка
            </button>

        </div>
        `
    );
}


/* ---------- HISTORY ---------- */

function historyPanel(){

    let h = [];

    try{
        h = JSON.parse(
            A.getHistory() || "[]"
        );
    }catch(e){
        h = [];
    }

    panel(
        "История",

        `
        <button
            onclick="
                A.clearHistory();
                historyPanel();
            "
        >
            Очистить историю
        </button>

        ${
            h.length
            ?
            h.map(
                x => `

                <div class="card">

                    <b>
                        ${esc(x.title)}
                    </b>

                    <div class="muted">
                        ${esc(x.url)}
                    </div>

                </div>

                `
            ).join("")
            :
            `
            <p class="muted">
                История пока пустая
            </p>
            `
        }
        `
    );
}


/* ---------- BOOKMARK ---------- */

function bookmark(){

    if(
        !bookmarks.some(
            x => x.url === tabs[active].url
        )
    ){

        bookmarks.unshift({
            title:tabs[active].title,
            url:tabs[active].url
        });

        A.saveBookmarks(
            JSON.stringify(bookmarks)
        );
    }
}


/* ---------- BOOKMARK PANEL ---------- */

function bookmarkPanel(){

    panel(
        "Закладки",

        bookmarks.length
        ?

        bookmarks.map(
            x => `

            <div
                class="card"
                onclick="
                    A.navigate('${esc(x.url)}')
                "
            >

                <b>
                    ${esc(x.title)}
                </b>

                <div class="muted">
                    ${esc(x.url)}
                </div>

            </div>

            `
        ).join("")

        :

        `
        <p class="muted">
            Закладок пока нет
        </p>
        `
    );
}


/* ---------- SETTINGS ---------- */

function settingsPanel(){

    panel(
        "Настройки",

        `

        <div class="row">

            <b>
                Интерфейс
            </b>

            <div class="muted">
                Liquid Glass
            </div>

        </div>


        <div class="row">

            <b>
                Приватный режим
            </b>

            <br>

            <button
                onclick="
                    privateMode=!privateMode;

                    A.setPrivateMode(
                        privateMode
                    );

                    alert(
                        privateMode
                        ?
                        'Приватный режим включён'
                        :
                        'Приватный режим выключен'
                    );
                "
            >
                Переключить
            </button>

        </div>


        <div class="row">

            <b>
                Закладки
            </b>

            <br>

            <button
                onclick="bookmarkPanel()"
            >
                Открыть
            </button>

        </div>


        <div class="row">

            <b>
                История
            </b>

            <br>

            <button
                onclick="historyPanel()"
            >
                Открыть
            </button>

        </div>

        `
    );
}


/* ---------- MENU ---------- */

function menu(){

    panel(
        "Меню",

        `

        <div
            class="card"
            onclick="home()"
        >
            🏠 Главная
        </div>

        <div
            class="card"
            onclick="historyPanel()"
        >
            ◷ История
        </div>

        <div
            class="card"
            onclick="bookmarkPanel()"
        >
            ☆ Закладки
        </div>

        <div
            class="card"
            onclick="tabsPanel()"
        >
            ▢ Вкладки
        </div>

        <div
            class="card"
            onclick="settingsPanel()"
        >
            ⚙ Настройки
        </div>

        `
    );
}


/* ---------- URL FROM NATIVE ---------- */

window.instawebNativeUrl = function(url){

    const input =
        document.getElementById("addr");

    if(input){
        input.value = url;
    }
};


/* ---------- START ---------- */
