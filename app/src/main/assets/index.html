<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Instaweb</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#08090c;
  color:#fff;
  font-family:Arial,sans-serif;
}

button,input{
  font:inherit;
}

button{
  border:0;
  color:inherit;
}

#app{
  width:100%;
  height:100%;
}

.home{
  min-height:100%;
  padding:28px 20px 110px;
  background:
    radial-gradient(circle at 20% 10%,rgba(110,120,255,.18),transparent 35%),
    radial-gradient(circle at 90% 40%,rgba(0,220,255,.10),transparent 35%),
    #08090c;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:55px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(20px);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-name{
  font-size:23px;
  font-weight:700;
}

.icon-btn{
  width:48px;
  height:48px;
  border-radius:17px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(20px);
  font-size:22px;
}

.hero{
  margin-bottom:28px;
}

.hero h1{
  margin:0;
  font-size:38px;
  line-height:1.05;
  letter-spacing:-1.5px;
}

.hero p{
  margin:14px 0 0;
  color:#9699a5;
  font-size:15px;
  line-height:1.5;
}

.search{
  display:flex;
  align-items:center;
  height:62px;
  padding:6px;
  border-radius:22px;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 10px 40px rgba(0,0,0,.25);
  backdrop-filter:blur(25px);
}

.search input{
  min-width:0;
  flex:1;
  height:100%;
  padding:0 16px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:16px;
}

.search input::placeholder{
  color:#8b8e99;
}

.search button{
  width:50px;
  height:50px;
  border-radius:17px;
  background:#fff;
  color:#111;
  font-size:24px;
}

.section{
  margin-top:35px;
}

.section-title{
  color:#999ca8;
  font-size:13px;
  letter-spacing:1px;
  margin-bottom:14px;
}

.sites{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.site{
  min-height:105px;
  border-radius:22px;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(20px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:9px;
}

.site-icon{
  width:43px;
  height:43px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.12);
  font-size:21px;
}

.site small{
  color:#d4d5da;
}

.card{
  margin-top:30px;
  padding:22px;
  border-radius:25px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(25px);
}

.card h2{
  margin:0 0 8px;
  font-size:22px;
}

.card p{
  margin:0;
  color:#9295a0;
  line-height:1.5;
}

.bottom{
  position:fixed;
  left:14px;
  right:14px;
  bottom:14px;
  height:72px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:7px;
  border-radius:26px;
  background:rgba(25,26,32,.78);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 15px 45px rgba(0,0,0,.45);
  backdrop-filter:blur(30px);
}

.nav{
  border-radius:20px;
  background:transparent;
  color:#858894;
  font-size:23px;
}

.nav.active{
  background:rgba(255,255,255,.11);
  color:#fff;
}

.nav small{
  display:block;
  margin-top:3px;
  font-size:10px;
}

.browser{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#fff;
}

.browser-bar{
  flex-shrink:0;
  height:76px;
  padding:9px;
  display:flex;
  gap:8px;
  align-items:center;
  background:#08090c;
}

.browser-bar button{
  width:52px;
  height:52px;
  flex-shrink:0;
  border-radius:18px;
  background:rgba(255,255,255,.08);
  font-size:24px;
}

.address{
  flex:1;
  min-width:0;
  height:52px;
  border:0;
  outline:0;
  border-radius:18px;
  padding:0 16px;
  background:rgba(255,255,255,.10);
  color:#fff;
  font-size:14px;
}

.webframe{
  flex:1;
  min-height:0;
  background:#fff;
}

.browser-tools{
  flex-shrink:0;
  height:78px;
  padding:10px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  background:#08090c;
}

.browser-tools button{
  border-radius:20px;
  background:rgba(255,255,255,.08);
  font-size:24px;
}

.panel{
  width:100%;
  height:100%;
  overflow:auto;
  padding:25px 20px 100px;
  background:
    radial-gradient(circle at 80% 10%,rgba(90,100,255,.16),transparent 35%),
    #08090c;
}

.panel-top{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:25px;
}

.panel-top h2{
  margin:0;
  font-size:28px;
}

.close{
  width:45px;
  height:45px;
  border-radius:16px;
  background:rgba(255,255,255,.09);
  font-size:22px;
}

.item{
  margin-bottom:12px;
  padding:18px;
  border-radius:20px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.10);
}

.item-title{
  font-weight:bold;
  margin-bottom:7px;
}

.item-url{
  color:#858995;
  font-size:12px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.item button,
.action{
  margin-top:13px;
  padding:11px 15px;
  border-radius:14px;
  background:rgba(255,255,255,.12);
}

.empty{
  color:#888b96;
  text-align:center;
  padding:50px 20px;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
const A = window.InstawebNative || {};

let screen = "home";
let privateMode = false;

let tabs = [
  {
    url:"https://www.google.com",
    title:"Google"
  }
];

let active = 0;

let bookmarks = [];

try{
  if(A.getBookmarks){
    bookmarks = JSON.parse(A.getBookmarks() || "[]");
  }
}catch(e){
  bookmarks = [];
}

function esc(value){
  return String(value || "")
    .replace(/[&<>"]/g,function(c){
      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;"
      }[c];
    });
}

function norm(value){

  const v = String(value || "").trim();

  if(!v){
    return "https://www.google.com";
  }

  if(/^https?:\/\//i.test(v)){
    return v;
  }

  if(/^[\w.-]+\.[a-z]{2,}/i.test(v)){
    return "https://" + v;
  }

  return "https://www.google.com/search?q=" +
    encodeURIComponent(v);
}

function go(value){

  const url = norm(value);

  tabs[active].url = url;
  tabs[active].title = url;

  screen = "browser";

  render();
}

function home(){
  screen = "home";
  render();
}

function browser(){
  screen = "browser";
  render();
}

function render(){

  const app = document.getElementById("app");

  if(!app){
    return;
  }

  if(screen === "browser"){
    renderBrowser();
    return;
  }

  if(screen === "tabs"){
    renderTabs();
    return;
  }

  if(screen === "history"){
    renderHistory();
    return;
  }

  if(screen === "bookmarks"){
    renderBookmarks();
    return;
  }

  if(screen === "settings"){
    renderSettings();
    return;
  }

  renderHome();
}

function renderHome(){

  const app = document.getElementById("app");

  app.innerHTML = `
    <div class="home">

      <div class="top">
        <div class="brand">
          <div class="logo">I</div>
          <div class="brand-name">Instaweb</div>
        </div>

        <button class="icon-btn"
          onclick="openSettings()">⚙</button>
      </div>

      <div class="hero">
        <h1>Твой интернет.<br>Твоё пространство.</h1>

        <p>
          Быстрый и простой браузер,
          созданный именно под тебя.
        </p>
      </div>

      <div class="search">

        <input
          id="q"
          autocomplete="off"
          placeholder="Поиск или адрес сайта"
          onkeydown="if(event.key==='Enter')go(this.value)"
        >

        <button
          onclick="go(document.getElementById('q').value)">
          →
        </button>

      </div>

      <div class="section">

        <div class="section-title">
          БЫСТРЫЙ ДОСТУП
        </div>

        <div class="sites">

          <button class="site"
            onclick="go('https://www.google.com')">
            <div class="site-icon">G</div>
            <small>Google</small>
          </button>

          <button class="site"
            onclick="go('https://www.youtube.com')">
            <div class="site-icon">▶</div>
            <small>YouTube</small>
          </button>

          <button class="site"
            onclick="go('https://wikipedia.org')">
            <div class="site-icon">W</div>
            <small>Wikipedia</small>
          </button>

        </div>

      </div>

      <div class="card">

        <h2>Instaweb</h2>

        <p>
          Минималистичный браузер
          с удобной навигацией и
          стеклянным интерфейсом.
        </p>

      </div>

    </div>

    ${homeNav()}
  `;
}

function homeNav(){

  return `
    <div class="bottom">

      <button class="nav active"
        onclick="home()">
        ⌂
        <small>Главная</small>
      </button>

      <button class="nav"
        onclick="openHistory()">
        ◷
        <small>История</small>
      </button>

      <button class="nav"
        onclick="openTabs()">
        □
        <small>Вкладки</small>
      </button>

      <button class="nav"
        onclick="openSettings()">
        ☰
        <small>Меню</small>
      </button>

    </div>
  `;
}

function renderBrowser(){

  const app = document.getElementById("app");

  const current =
    tabs[active] ||
    {url:"https://www.google.com",title:"Google"};

  app.innerHTML = `
    <div class="browser">

      <div class="browser-bar">

        <button onclick="nativeBack()">‹</button>

        <input
          class="address"
          id="addr"
          value="${esc(current.url)}"
          onkeydown="if(event.key==='Enter')go(this.value)"
        >

        <button onclick="nativeRefresh()">↻</button>

      </div>

      <div
        class="webframe"
        id="webframe">
      </div>

      <div class="browser-tools">

        <button onclick="nativeBack()">‹</button>

        <button onclick="nativeForward()">›</button>

        <button onclick="saveBookmark()">☆</button>

        <button onclick="openTabs()">□</button>

        <button onclick="openSettings()">☰</button>

      </div>

    </div>
  `;

  if(A.navigate){
    A.navigate(current.url);
  }
}

function nativeBack(){

  if(A.back){
    A.back();
  }
}

function nativeForward(){

  if(A.forward){
    A.forward();
  }
}

function nativeRefresh(){

  if(A.refresh){
    A.refresh();
  }
}

function openTabs(){

  screen = "tabs";
  render();
}

function renderTabs(){

  const app = document.getElementById("app");

  let html = "";

  tabs.forEach(function(t,i){

    html += `
      <div class="item">

        <div class="item-title">
          ${esc(t.title)}
        </div>

        <div class="item-url">
          ${esc(t.url)}
        </div>

        <button class="action"
          onclick="active=${i};browser()">
          Открыть
        </button>

        <button class="action"
          onclick="closeTab(${i})">
          Закрыть
        </button>

      </div>
    `;

  });

  html += `
    <button class="action"
      onclick="newTab()">
      + Новая вкладка
    </button>
  `;

  app.innerHTML = `
    <div class="panel">

      <div class="panel-top">
        <button class="close"
          onclick="home()">‹</button>
        <h2>Вкладки</h2>
      </div>

      ${html}

    </div>
  `;
}

function newTab(){

  tabs.push({
    url:"https://www.google.com",
    title:"Google"
  });

  active = tabs.length - 1;

  browser();
}

function closeTab(i){

  tabs.splice(i,1);

  if(tabs.length === 0){

    tabs.push({
      url:"https://www.google.com",
      title:"Google"
    });

  }

  active = Math.min(
    active,
    tabs.length - 1
  );

  renderTabs();
}

function openHistory(){

  screen = "history";
  render();
}

function renderHistory(){

  const app = document.getElementById("app");

  let history = [];

  try{
    if(A.getHistory){
      history = JSON.parse(
        A.getHistory() || "[]"
      );
    }
  }catch(e){
    history = [];
  }

  let html = "";

  if(history.length === 0){

    html = `
      <div class="empty">
        История пока пуста
      </div>
    `;

  }else{

    history.forEach(function(x){

      html += `
        <div class="item">

          <div class="item-title">
            ${esc(x.title || x.url)}
          </div>

          <div class="item-url">
            ${esc(x.url)}
          </div>

        </div>
      `;

    });

  }

  app.innerHTML = `
    <div class="panel">

      <div class="panel-top">
        <button class="close"
          onclick="home()">‹</button>
        <h2>История</h2>
      </div>

      ${html}

      <button class="action"
        onclick="clearHistory()">
        Очистить историю
      </button>

    </div>
  `;
}

function clearHistory(){

  if(A.clearHistory){
    A.clearHistory();
  }

  renderHistory();
}

function saveBookmark(){

  const current = tabs[active];

  if(!bookmarks.some(function(x){
    return x.url === current.url;
  })){

    bookmarks.unshift({
      title:current.title,
      url:current.url
    });

    if(A.saveBookmarks){
      A.saveBookmarks(
        JSON.stringify(bookmarks)
      );
    }
  }
}

function openBookmarks(){

  screen = "bookmarks";
  render();
}

function renderBookmarks(){

  const app = document.getElementById("app");

  if(bookmarks.length === 0){

    app.innerHTML = `
      <div class="panel">

        <div class="panel-top">
          <button class="close"
            onclick="home()">‹</button>
          <h2>Закладки</h2>
        </div>

        <div class="empty">
          Закладок пока нет
        </div>

      </div>
    `;

    return;
  }

  let html = "";

  bookmarks.forEach(function(x){

    html += `
      <div class="item"
        onclick="go('${esc(x.url)}')">

        <div class="item-title">
          ${esc(x.title)}
        </div>

        <div class="item-url">
          ${esc(x.url)}
        </div>

      </div>
    `;

  });

  app.innerHTML = `
    <div class="panel">

      <div class="panel-top">
        <button class="close"
          onclick="home()">‹</button>
        <h2>Закладки</h2>
      </div>

      ${html}

    </div>
  `;
}

function openSettings(){

  screen = "settings";
  render();
}

function renderSettings(){

  const app = document.getElementById("app");

  app.innerHTML = `
    <div class="panel">

      <div class="panel-top">
        <button class="close"
          onclick="home()">‹</button>

        <h2>Меню</h2>
      </div>

      <div class="item">
        <div class="item-title">
          🏠 Главная
        </div>

        <button class="action"
          onclick="home()">
          Открыть
        </button>
      </div>

      <div class="item">
        <div class="item-title">
          ◷ История
        </div>

        <button class="action"
          onclick="openHistory()">
          Открыть
        </button>
      </div>

      <div class="item">
        <div class="item-title">
          ☆ Закладки
        </div>

        <button class="action"
          onclick="openBookmarks()">
          Открыть
        </button>
      </div>

      <div class="item">
        <div class="item-title">
          □ Вкладки
        </div>

        <button class="action"
          onclick="openTabs()">
          Открыть
        </button>
      </div>

      <div class="item">
        <div class="item-title">
          Приватный режим
        </div>

        <button class="action"
          onclick="togglePrivate()">
          ${privateMode ? "Выключить" : "Включить"}
        </button>
      </div>

    </div>
  `;
}

function togglePrivate(){

  privateMode = !privateMode;

  if(A.setPrivateMode){
    A.setPrivateMode(privateMode);
  }

  renderSettings();
}

window.instawebSetUrl = function(url){

  const addr =
    document.getElementById("addr");

  if(addr){
    addr.value = url || "";
  }
};

window.instawebNativeUrl = function(url){

  const addr =
    document.getElementById("addr");

  if(addr){
    addr.value = url || "";
  }
};

render();
</script>

</body>
</html>
